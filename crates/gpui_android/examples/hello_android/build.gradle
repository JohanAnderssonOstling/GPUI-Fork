plugins {
    id 'com.android.application' version '8.11.0'
}

android {
    namespace = 'dev.gpui.hello'
    compileSdk = 36

    defaultConfig {
        applicationId = 'dev.gpui.hello'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            jniLibs.srcDirs = ['jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.games:games-activity:4.4.0'
}

tasks.register('verifyRustLibrary') {
    doLast {
        if (fileTree('jniLibs') { include '**/libhello_android.so' }.isEmpty()) {
            throw new GradleException('Build the Rust library first: cargo ndk -t arm64-v8a -o jniLibs build --release')
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'verifyRustLibrary'
}
