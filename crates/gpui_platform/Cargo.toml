[package]
name = "gpui_platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"

[features]
default = []
# Opt in to native desktop notification delivery and response handling.
system-notifications = ["gpui_linux/system-notifications", "gpui_macos/system-notifications", "gpui_windows/system-notifications"]
snapshot = ["gpui/snapshot", "gpui_linux/snapshot", "gpui_windows/snapshot", "gpui_macos/snapshot"]
font-kit = ["gpui_macos/font-kit"]
test-support = [
    "gpui/test-support",
    "gpui_macos/test-support",
    "dep:gpui_wgpu",
    "gpui_wgpu/test-support",
]
screen-capture = ["gpui/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]

[dependencies]
gpui.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows.workspace = true
gpui = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux.workspace = true
gpui_wgpu = { workspace = true, optional = true, features = ["font-kit"] }

[target.'cfg(target_os = "android")'.dependencies]
gpui_android.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
console_error_panic_hook.workspace = true
